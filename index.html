<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Time tracking dashboard</title>

  <link rel="stylesheet" href="style.css">
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

</head>
<body>
  <div class="container">

    <div class="main_card">
      <div class="main_info">
        <img src="images/image-jeremy.png" alt="person">
        <p>Report for</p>
        <h1>
          Jeremy Robson
        </h1>
      </div>
      <div class="all_btn">
        <button type="button" id="daily" class="active">Daily</button>
        <button type="button" id="weekly">Weekly</button>
        <button type="button" id="monthly">Monthly</button>
      </div>
    </div>
    
    <div id="all_tasks">
      <!-- all cards will be in -->
    </div>

  </div>
 


  
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="https://shymaaragab.github.io/Portfolio/">Shaimaa Ragab</a>.
  </div>
  <script src="app.js"></script>
</body>
</html>
